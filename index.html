<!DOCTYPE html>
<html lang="pt"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0a0508"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>TUDO SEXO</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon.svg"/>
<style>
:root{--bg:#070308;--panel:#12060c;--line:#3a1524;--red:#c41e3a;--pink:#ff4d6d;--cream:#f7e8ec;--mute:#9a7580;--me:#3a101c;--bot:#1a0b12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);font-family:ui-sans-serif,system-ui,sans-serif}
.app{height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#0c0408}
header h1{margin:0;font-size:15px;letter-spacing:.16em;flex:1}header h1 span{color:var(--pink)}
.dot{width:8px;height:8px;border-radius:50%;background:#3dcc7a}
.ico{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--cream);font-size:16px}
#feed{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:16px;line-height:1.45;font-size:15px;white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
.chip{border:1px solid var(--line);background:#12070c;color:var(--cream);border-radius:999px;padding:6px 10px;font-size:12px}
.composer{border-top:1px solid var(--line);background:#0c0408;padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;min-height:44px;max-height:120px;background:var(--panel);color:var(--cream);border:1px solid var(--line);border-radius:14px;padding:11px 12px;font-size:16px}
.send{background:linear-gradient(180deg,#e23a56,#9b1228);border-color:transparent;font-weight:800}
.hint{font-size:12px;color:var(--mute);padding:4px 6px 0}
input[type=file]{display:none}
</style></head>
<body>
<div class="app">
<header><div class="dot"></div><h1>TUDO <span>SEXO</span></h1></header>
<div id="feed"></div>
<div class="chips" id="chips"></div>
<div class="composer">
<div class="row">
<button class="ico" id="plus">+</button>
<button class="ico" id="cam">cam</button>
<textarea id="inp" rows="1" placeholder="Mete qualquer coisa..."></textarea>
<button class="ico send" id="send">OK</button>
</div>
<div class="hint">Prototipo. Agente no telemovel. Sem API.</div>
<input id="file" type="file" accept="*/*" multiple/>
<input id="camfile" type="file" accept="image/*" capture="environment"/>
</div></div>
<script>
const feed=document.getElementById('feed');
const inp=document.getElementById('inp');
const V=['fode','lambe','engole','esfrega','enfia','chupa','abre','monta','goza'];
const C=['boceta','pau','cu','garganta','lingua','peito'];
const F=['baba','porra','cuspo','suor'];
const A=['inchado','pingando','latejando','babado','aberto'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function add(role,t){const d=document.createElement('div');d.className='msg '+role;d.textContent=t;feed.appendChild(d);feed.scrollTop=feed.scrollHeight;}
function agent(t){const v=pick(V),c=pick(C),f=pick(F),a=pick(A);const alvo=(t||'isto').trim();return alvo+' deixou de ser normal. '+c+' '+a+'. '+v+' sem negociar. '+f+' a vista. Agente local, prototipo, sem API.';}
add('bot','Prototipo TUDO SEXO no ar.\nEscreve qualquer coisa. Eu transformo em sexo.\nAdultos only.');
['cafe','metro','reuniao','chuva em Lisboa','netflix'].forEach(p=>{const b=document.createElement('button');b.className='chip';b.textContent=p;b.onclick=()=>{inp.value=p;send();};document.getElementById('chips').appendChild(b);});
function send(){const t=inp.value.trim();if(!t)return;add('me',t);inp.value='';add('bot',agent(t));}
document.getElementById('send').onclick=send;
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
document.getElementById('plus').onclick=()=>document.getElementById('file').click();
document.getElementById('cam').onclick=()=>document.getElementById('camfile').click();
document.getElementById('file').onchange=()=>add('bot','Anexo recebido. Trata como corpo: pele, pressao, gozo.');
document.getElementById('camfile').onchange=()=>add('bot','Foto da camara recebida. Ja nao e inocente.');
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
